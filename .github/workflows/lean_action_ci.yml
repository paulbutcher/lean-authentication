name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # The reference backend has to pass the conformance suite, so the suite needs a server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: leanauthentication
          POSTGRES_PASSWORD: leanauthentication
          POSTGRES_DB: leanauthentication
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AUTHENTICATION_POSTGRES: >-
        host=localhost port=5432 dbname=leanauthentication
        user=leanauthentication password=leanauthentication

    steps:
      - uses: actions/checkout@v5
      # libpq for the Postgres backend, libcurl for the outbound transports, libssl for
      # `lean-libcrypto`: each builds a shim with `pkg-config`, which needs the development
      # package and not just the runtime library the runner already has. `libssl-dev` arrives
      # today as a dependency of `libcurl4-openssl-dev`, which holds only while curl is the
      # OpenSSL flavour, so it is asked for rather than inherited.
      - name: Install libpq, libcurl and libssl
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libcurl4-openssl-dev libssl-dev
      - uses: leanprover/lean-action@v1
